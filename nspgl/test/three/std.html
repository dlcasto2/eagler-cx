<!DOCTYPE html><html><head><style>body{margin:0;background:#000}</style></head><body>
<script src="three.min.js"></script>
<script>
const renderer = new THREE.WebGLRenderer(); renderer.setSize(320, 240); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x203040);
const camera = new THREE.PerspectiveCamera(60, 4/3, 0.1, 100); camera.position.set(0, 1.2, 3); camera.lookAt(0, 0, 0);
const size = 16, data = new Uint8Array(size * size * 4);
for (let i = 0; i < size * size; i++) { const c = ((i % size) ^ (i / size | 0)) & 4 ? 255 : 40; data.set([c, c, 255 - c, 255], i * 4); }
const tex = new THREE.DataTexture(data, size, size); tex.needsUpdate = true;
const plane = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), new THREE.MeshBasicMaterial({ map: tex }));
plane.rotation.x = -Math.PI / 2; plane.position.y = -0.6; scene.add(plane);
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 12), new THREE.MeshStandardMaterial({ color: 0xff4422, roughness: 0.4, metalness: 0.2 }));
scene.add(ball);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.6));
const dl = new THREE.DirectionalLight(0xffffff, 1); dl.position.set(2, 3, 2); scene.add(dl);
const pts = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute([-1,1,0, 1,1,0, 0,1.5,0], 3)), new THREE.PointsMaterial({ color: 0xffff00, size: 0.2 }));
scene.add(pts);
renderer.setAnimationLoop(t => { ball.position.x = Math.sin(t * 0.001); renderer.render(scene, camera); });
</script></body></html>
