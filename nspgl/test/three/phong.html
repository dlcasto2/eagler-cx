<!DOCTYPE html><html><head><title>three basic</title><style>body{margin:0;background:#000}</style></head><body>
<script src="three.min.js"></script>
<script>
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(320, 240);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 320/240, 0.1, 100);
camera.position.z = 3;
const mesh = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshPhongMaterial({color:0xff8844}));
scene.add(mesh); scene.add(new THREE.AmbientLight(0x404040)); const l=new THREE.DirectionalLight(0xffffff,1); l.position.set(1,2,3); scene.add(l);
function anim(t){ mesh.rotation.x = t*0.001; mesh.rotation.y = t*0.0013; renderer.render(scene, camera); requestAnimationFrame(anim); }
requestAnimationFrame(anim);
</script></body></html>
