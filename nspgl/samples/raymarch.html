<!DOCTYPE html>
<html><head><title>Raymarcher</title><style>body{margin:0;background:#000}canvas{width:100%;height:100%}</style></head>
<body><canvas id="c" width="160" height="120"></canvas>
<script id="fs" type="x-shader/x-fragment">
precision mediump float;
uniform vec2 iResolution; uniform float iTime;
#define STEPS 24
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }
float sdBox(vec3 p, vec3 b) { vec3 q = abs(p) - b; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0); }
float map(vec3 p) {
  p.xz *= rot(iTime * 0.5);
  p.xy *= rot(iTime * 0.3);
  float d = sdBox(p, vec3(0.6));
  return max(d, -(length(p) - 0.75));
}
vec3 normal(vec3 p) {
  vec2 e = vec2(0.01, 0.0);
  return normalize(vec3(map(p + e.xyy) - map(p - e.xyy), map(p + e.yxy) - map(p - e.yxy), map(p + e.yyx) - map(p - e.yyx)));
}
void main() {
  vec2 uv = (gl_FragCoord.xy * 2.0 - iResolution) / iResolution.y;
  vec3 ro = vec3(0.0, 0.0, -2.5), rd = normalize(vec3(uv, 1.5));
  float t = 0.0; bool hit = false;
  for (int i = 0; i < STEPS; i++) {
    float d = map(ro + rd * t);
    if (d < 0.01) { hit = true; break; }
    t += d;
    if (t > 6.0) break;
  }
  vec3 col = vec3(0.1, 0.12, 0.2) * (1.0 - uv.y * 0.5);
  if (hit) {
    vec3 n = normal(ro + rd * t);
    float dif = clamp(dot(n, normalize(vec3(0.6, 0.8, -0.5))), 0.0, 1.0);
    col = mix(vec3(0.9, 0.5, 0.2), n * 0.5 + 0.5, 0.3) * (0.2 + 0.8 * dif);
  }
  gl_FragColor = vec4(col, 1.0);
}
</script>
<script>
const c = document.getElementById('c'), gl = c.getContext('webgl');
const pr = gl.createProgram();
for (const [t, s] of [[gl.VERTEX_SHADER, 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }'],
                      [gl.FRAGMENT_SHADER, document.getElementById('fs').text]]) {
  const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o);
  if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(o));
  gl.attachShader(pr, o);
}
gl.linkProgram(pr); gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const ur = gl.getUniformLocation(pr, 'iResolution'), ut = gl.getUniformLocation(pr, 'iTime');
(function f(t) { gl.uniform2f(ur, c.width, c.height); gl.uniform1f(ut, t / 1000); gl.drawArrays(gl.TRIANGLES, 0, 3); requestAnimationFrame(f); })(0);
</script></body></html>
