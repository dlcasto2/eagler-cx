<!DOCTYPE html>
<html><head><title>Texture</title></head>
<body style="background:#223;color:#eee">
<h2>Canvas texture</h2>
<canvas id="c" width="256" height="160"></canvas>
<p>A 2D canvas is drawn, then uploaded with <code>texImage2D</code>.</p>
<script>
const src = document.createElement('canvas'); src.width = 64; src.height = 64;
const g2 = src.getContext('2d');
for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { g2.fillStyle = (x + y) % 2 ? '#f80' : '#048'; g2.fillRect(x * 8, y * 8, 8, 8); }
g2.fillStyle = '#fff'; g2.font = 'bold 16px sans-serif'; g2.fillText('GL', 20, 38);
const c = document.getElementById('c'), gl = c.getContext('webgl');
function S(t, s) { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(o)); return o; }
const pr = gl.createProgram();
gl.attachShader(pr, S(gl.VERTEX_SHADER, 'attribute vec2 p; uniform float a; varying vec2 uv; void main(){ uv = p*0.5+0.5; float c=cos(a), s=sin(a); gl_Position = vec4(mat2(c,s,-s,c)*p*0.7, 0.0, 1.0); }'));
gl.attachShader(pr, S(gl.FRAGMENT_SHADER, 'precision mediump float; varying vec2 uv; uniform sampler2D tex; void main(){ gl_FragColor = texture2D(tex, uv*2.0); }'));
gl.linkProgram(pr); gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const lp = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(lp); gl.vertexAttribPointer(lp, 2, gl.FLOAT, false, 0, 0);
const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
gl.uniform1i(gl.getUniformLocation(pr, 'tex'), 0);
const ua = gl.getUniformLocation(pr, 'a');
(function f(t) { gl.clearColor(0.1, 0.1, 0.2, 1); gl.clear(gl.COLOR_BUFFER_BIT); gl.uniform1f(ua, t * 0.0005); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); requestAnimationFrame(f); })(0);
</script>
</body></html>
