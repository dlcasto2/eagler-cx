<!DOCTYPE html>
<html><head><title>2D canvas</title></head>
<body>
<h2>Canvas 2D</h2>
<canvas id="c" width="300" height="150" style="background:#fff"></canvas>
<script>
const g = document.getElementById('c').getContext('2d');
let t = 0;
function draw() {
  g.fillStyle = '#eef'; g.fillRect(0, 0, 300, 150);
  g.fillStyle = 'rgb(200,40,40)'; g.beginPath(); g.arc(75 + Math.sin(t) * 30, 75, 30, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#063'; g.lineWidth = 4; g.beginPath(); g.moveTo(150, 20); g.lineTo(280, 130); g.lineTo(150, 130); g.closePath(); g.stroke();
  g.save(); g.translate(225, 50); g.rotate(t); g.fillStyle = 'rgba(0,0,255,0.6)'; g.fillRect(-20, -20, 40, 40); g.restore();
  g.fillStyle = '#000'; g.font = '12px sans-serif'; g.fillText('t = ' + t.toFixed(2), 10, 140);
  t += 0.05; requestAnimationFrame(draw);
}
draw();
</script>
</body></html>
