   name: Calculator build
   # Builds crafti.tns and crafti-stress.tns with the Ndless r2020 SDK.
   # Mirrors ndless-nspire/Ndless/.github/workflows/main.yml at r2020.
   on: [push, workflow_dispatch]
   jobs:
     build:
       runs-on: ubuntu-22.04
       steps:
         - uses: actions/checkout@v4
           with: { submodules: recursive, path: crafti }
         - uses: actions/checkout@v4
           with: { repository: ndless-nspire/Ndless, ref: r2020, submodules: recursive, fetch-depth: 0, path: ndless }
         - run: sudo apt-get install -y libgmp-dev libmpfr-dev libmpc-dev libboost-program-options-dev
         - uses: actions/cache@v4
           id: toolchain
           with:
             path: ndless/ndless-sdk/toolchain/install
             key: ndless-r2020-${{ hashFiles('ndless/ndless-sdk/toolchain/build_toolchain.sh') }}
         - if: steps.toolchain.outputs.cache-hit != 'true'
           working-directory: ndless/ndless-sdk/toolchain
           run: ./build_toolchain.sh
         - run: |
             echo "$GITHUB_WORKSPACE/ndless/ndless-sdk/toolchain/install/bin" >> $GITHUB_PATH
             echo "$GITHUB_WORKSPACE/ndless/ndless-sdk/bin" >> $GITHUB_PATH
         - working-directory: ndless
           run: make -j$(nproc)
         - working-directory: crafti
           run: make -j$(nproc) && make clean-objs && make STRESS=1 -j$(nproc)
         - name: Check the .tns files
           working-directory: crafti
           run: |
             for f in *.tns; do
               size=$(stat -c %s "$f")
               head=$(head -c 4 "$f" | od -An -c | tr -s ' ')
               sum=$(sha256sum "$f" | cut -c1-16)
               echo "::notice title=$f::size=$size bytes, starts with [$head], sha256=$sum"
               if [ "$(head -c 3 "$f")" != "PRG" ]; then echo "::error title=$f::not an Ndless program"; exit 1; fi
             done
         - uses: actions/upload-artifact@v4
           with: { name: crafti-calculator, path: "crafti/*.tns" }
